
server:
  port: 8082
spring:

  application:
    name: booking-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 3000
      circuitbreaker:
        enabled: true
        group:
          enabled: false

# Seuils Resilience4j demandés pour l'event-service
ticketflow:
  resilience:
    event-service:
      sliding-window-size: 10
      minimum-number-of-calls: 5
      failure-rate-threshold: 50
      wait-in-open-state: 10s
      permitted-calls-in-half-open-state: 3
      time-limit: 4s